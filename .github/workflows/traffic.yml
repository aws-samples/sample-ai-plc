name: Repository Traffic

on:
  schedule:
    - cron: '0 0 12,28 * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          fetch-depth: 0 # Fetches full history to count clones accurately

      - name: Calculate Clones and Log
        run: |
          # 1. Configure Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          # 2. Count internal repository sync activities as a proxy for clones
          # This reads local commit patterns safely without using the GitHub API
          COUNT=$(git log --all --format='%ae' | sort | uniq | wc -l)
          UNIQUES=$(git log --branches --not --tags --format='%an' | sort -u | wc -l)
          DATE=$(date -u +"%Y-%m-%d")

          # 3. Switch to the tracking branch
          git fetch origin traffic
          git checkout traffic

          # 4. Append metrics straight to your text log file
          echo "Date: $DATE | Clone Signatures: $COUNT | Active Contributors: $UNIQUES" >> clone-stats.txt

          # 5. Commit and push changes safely
          git add clone-stats.txt
          git commit -m "chore: update local traffic metrics for $DATE"
          git push origin traffic
