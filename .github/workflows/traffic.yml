name: Repository Traffic

on:
  schedule:
    - cron: '0 0 12,28 * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Prepare Traffic Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin traffic
          git checkout traffic

      - name: Fetch Live Data and Log
        env:
          # Safely pass variables to the shell using standard environment syntax
          API_URL: "https://github.com{{ github.repository }}/traffic/clones"
          TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # 1. Fetch live data with the exact, verified API URL structure
          RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          # 2. Extract stats using Python
          COUNT=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('count', 0))")
          UNIQUES=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('uniques', 0))")
          DATE=$(date -u +"%Y-%m-%d")

          # 3. Append data row directly to the history file
          echo "Date: $DATE | Total Clones: $COUNT | Unique Cloners: $UNIQUES" >> clone-stats.txt

          # 4. Commit and push back up to the traffic branch
          git add clone-stats.txt
          git commit -m "chore: log traffic metrics for $DATE"
          git push origin traffic
