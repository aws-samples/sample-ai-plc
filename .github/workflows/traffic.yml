name: Repository Traffic

on:
  schedule:
    - cron: '0 0 12,28 * *'
  workflow_dispatch:

jobs:
  log-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Debug Clone Data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "==== TEST 1: Calling API ===="
          RESPONSE=$(curl -s -v -H "Authorization: Bearer $TRAFFIC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com")
          
          echo "GitHub API Response Body:"
          echo "$RESPONSE"
          
          # Explicit safe exit to avoid hiding the actual error message
          if [[ "$RESPONSE" == *"message"* ]]; then
             echo "==== FAILED: GitHub rejected the token ===="
             exit 1
          fi
