name: Repository Traffic

on:
  schedule:
    - cron: '0 0 12,28 * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Prepare Traffic Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git fetch origin traffic
          git checkout traffic

      - name: Fetch Live Data and Log
        env:
          TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # 1. Fetch live metrics directly from the official GitHub API database
          RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com")

          # 2. Extract the official total and unique counts via Python
          TOTAL_CLONES=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('count', 0))")
          UNIQUE_CLONERS=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('uniques', 0))")
          DATE=$(date -u +"%Y-%m-%d")

          # 3. Append the explicit, official counts straight into your log file
          echo "Date: $DATE | Total Clones: $TOTAL_CLONES | Unique Cloners: $UNIQUE_CLONERS" >> clone-stats.txt

          # 4. Commit and push back up to the traffic branch
          git add clone-stats.txt
          git commit -m "chore: log official traffic metrics for $DATE"
          git push origin traffic
