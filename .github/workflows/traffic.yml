name: Repository Traffic

on:
  schedule:
    - cron: '0 0 15,30 * *' # Runs on the 1st and 15th of the month
  workflow_dispatch: # Lets you run it manually whenever you want

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the tool to save the data
    steps:
      - name: Sync Traffic
        uses: sangonzal/repository-traffic-action@v0.1.5
        env:
          # Automatically uses your built-in GitHub secret
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_TOKEN }} 
